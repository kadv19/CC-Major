<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Medicines - Patient Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23BE6A3E%22 stroke-width=%222%22><rect x=%224%22 y=%2210%22 width=%2216%22 height=%228%22 rx=%224%22/><path d=%22M12 10v8%22/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="login-body" data-app="patient">
    <div class="login-container">
        <div class="login-card">
            <div class="login-mark" aria-hidden="true">
                <svg class="icon icon-lg" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="8" rx="4"></rect><path d="M12 10v8"></path></svg>
            </div>
            <h1 class="login-title">My Medicines</h1>
            <p class="login-subtitle" id="loginSubtitle">A gentle reminder, right on time.</p>

            {% if error %}
            <div id="errorArea" class="error-area" role="alert" aria-live="assertive">{{ error }}</div>
            {% else %}
            <div id="errorArea" class="error-area" style="display:none;" role="alert" aria-live="assertive"></div>
            {% endif %}

            <form id="loginForm" method="POST" action="/login" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g., patient1" required autocomplete="username" style="min-height:48px; font-size:1.05rem;">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password" style="min-height:48px; font-size:1.05rem;">
                </div>
                <div class="form-group">
                    <label for="languageSelectLogin">Language</label>
                    <select id="languageSelectLogin" name="language" style="min-height:48px; font-size:1rem;">
                        <option value="en-US">English</option>
                        <option value="hi-IN">हिन्दी (Hindi)</option>
                        <option value="kn-IN">ಕನ್ನಡ (Kannada)</option>
                    </select>
                    <small style="color:var(--gray-500); font-size:0.75rem;">This only changes what you read on screen.</small>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="min-height:56px; font-size:1.1rem;">Log in</button>
            </form>

            <div class="login-hint">
                <p><strong>Try it:</strong> patient1 / 1234</p>
                <p style="font-size:0.80rem; color:var(--gray-500);">Also works: patient2, patient3, patient4, patient5 (same password)</p>
            </div>
            <p class="login-note">Looking after someone? Use the caregiver website instead.</p>
        </div>
    </div>

    <script>
        // Language affects UI copy on login page
        const copy = {
            'en-US': {title:'My Medicines', subtitle:'A gentle reminder, right on time.', username:'Username', password:'Password', login:'Log in', hint:'Try it: patient1 / 1234', note:'Looking after someone? Use the caregiver website instead.'},
            'hi-IN': {title:'मेरी दवाइयाँ', subtitle:'सही समय पर एक कोमल याद दिलाना।', username:'उपयोगकर्ता नाम', password:'पासवर्ड', login:'लॉगिन करें', hint:'आज़माएँ: patient1 / 1234', note:'किसी की देखभाल कर रहे हैं? देखभालकर्ता वेबसाइट का उपयोग करें।'},
            'kn-IN': {title:'ನನ್ನ ಔಷಧಿಗಳು', subtitle:'ಸರಿಯಾದ ಸಮಯಕ್ಕೆ ಒಂದು ಆಪ್ತ ನೆನಪು.', username:'ಬಳಕೆದಾರ ಹೆಸರು', password:'ಪಾಸ್‌ವರ್ಡ್', login:'ಲಾಗಿನ್ ಮಾಡಿ', hint:'ಪ್ರಯತ್ನಿಸಿ: patient1 / 1234', note:'ಯಾರನ್ನಾದರೂ ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದೀರಾ? ಆರೈಕೆದಾರರ ವೆಬ್‌ಸೈಟ್ ಬಳಸಿ.'}
        };
        const langSel = document.getElementById('languageSelectLogin');
        const storedLang = localStorage.getItem('patient_lang') || 'en-US';
        langSel.value = storedLang;
        function applyLoginLang(lang){
            const c = copy[lang] || copy['en-US'];
            document.querySelector('.login-title').textContent = c.title;
            document.getElementById('loginSubtitle').textContent = c.subtitle;
            document.querySelector('label[for="username"]').textContent = c.username;
            document.querySelector('label[for="password"]').textContent = c.password;
            document.querySelector('button[type="submit"]').textContent = c.login;
            const h = document.querySelector('.login-hint p');
            if(h) h.innerHTML = '<strong>' + (c.hint.split(':')[0]) + ':</strong>' + c.hint.split(':').slice(1).join(':');
            const n = document.querySelector('.login-note');
            if(n) n.textContent = c.note;
        }
        applyLoginLang(storedLang);
        langSel.addEventListener('change', function(){
            localStorage.setItem('patient_lang', this.value);
            applyLoginLang(this.value);
        });

        // Handle form via fetch to show errors without reload where possible, but also support normal POST
        const form = document.getElementById('loginForm');
        const errorArea = document.getElementById('errorArea');
        form.addEventListener('submit', async function(e){
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if(!username || !password){
                errorArea.textContent = 'Please enter both a username and a password.';
                errorArea.style.display = 'block';
                return;
            }
            localStorage.setItem('patient_lang', langSel.value);
            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({username, password})
                });
                const data = await resp.json().catch(()=>({}));
                if(resp.ok){
                    window.location.href = '/';
                } else {
                    errorArea.textContent = data.error || "That didn't work — please check your username and password.";
                    errorArea.style.display = 'block';
                }
            } catch(err){
                errorArea.textContent = 'Having trouble connecting. Trying again...';
                errorArea.style.display = 'block';
                setTimeout(()=>{ form.removeEventListener('submit', arguments.callee); form.submit(); }, 800);
            }
        });
        // Show server-rendered error if present
        (function(){
            const err = errorArea.textContent.trim();
            if(err){ errorArea.style.display='block'; }
        })();
    </script>
    <style>
        .login-body {
            background: var(--paper);
            background-image: radial-gradient(circle at 15% 10%, rgba(190,106,62,0.08), transparent 45%), radial-gradient(circle at 85% 90%, rgba(126,152,115,0.08), transparent 45%);
            display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px;
        }
        .login-container { width:100%; max-width:440px; }
        .login-mark { display:flex; justify-content:center; margin-bottom:14px; color:var(--accent); }
        .login-card { background:var(--white); border-radius:20px; padding:36px 32px; box-shadow: var(--shadow-lg); border-top:3px solid var(--accent); }
        .login-title { font-size:1.7rem; font-weight:600; text-align:center; margin-bottom:6px; }
        .login-subtitle { text-align:center; color:var(--gray-500); margin-bottom:22px; font-size:0.95rem; }
        .error-area { background:var(--red-light); border:1px solid var(--red); color:var(--red-dark); padding:11px 15px; border-radius:var(--radius-sm); margin-bottom:16px; font-weight:600; font-size:0.90rem; }
        .login-hint { margin-top:18px; text-align:center; background:var(--gray-50); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--gray-100); font-size:0.88rem; }
        .login-note { text-align:center; margin-top:12px; font-size:0.82rem; color:var(--gray-500); }
    </style>
</body>
</html>
