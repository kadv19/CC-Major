<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Dashboard - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%235B7A85%22 stroke-width=%222%22><circle cx=%2212%22 cy=%228%22 r=%223.5%22/><path d=%22M4 20c0-4 4-6 8-6s8 2 8 6%22/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body" data-app="caregiver">
    <div class="login-container">
        <div class="login-card">
            <div class="login-mark" aria-hidden="true">
                <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path></svg>
            </div>
            <h1 class="login-title">Caregiver Dashboard</h1>
            <p class="login-subtitle">Keep track of the people you care for.</p>

            {% if error %}
            <div id="errorArea" class="error-area" role="alert" aria-live="assertive">{{ error }}</div>
            {% else %}
            <div id="errorArea" class="error-area" style="display:none;" role="alert" aria-live="assertive"></div>
            {% endif %}

            <form id="loginForm" method="POST" action="/login" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="e.g., caregiver" required autocomplete="username" style="min-height:48px; font-size:1.05rem;">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password" style="min-height:48px; font-size:1.05rem;">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="min-height:56px; font-size:1.1rem;">Log in</button>
            </form>

            <div class="login-hint">
                <p><strong>Try it:</strong> caregiver / 1234</p>
            </div>
            <p class="login-note">Here as a patient? Use the patient website instead.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorArea = document.getElementById('errorArea');
        form.addEventListener('submit', async function(e){
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if(!username || !password){
                errorArea.textContent = 'Please enter both a username and a password.';
                errorArea.style.display = 'block';
                return;
            }
            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({username, password})
                });
                const data = await resp.json().catch(()=>({}));
                if(resp.ok){
                    window.location.href = '/';
                } else {
                    errorArea.textContent = data.error || "That didn't work — please check your username and password.";
                    errorArea.style.display = 'block';
                }
            } catch(err){
                errorArea.textContent = 'Having trouble connecting. Trying again...';
                errorArea.style.display = 'block';
                setTimeout(()=>{ form.removeEventListener('submit', arguments.callee); form.submit(); }, 800);
            }
        });
        (function(){
            const err = errorArea.textContent.trim();
            if(err){ errorArea.style.display='block'; }
        })();
    </script>
    <style>
        .login-body {
            background: var(--paper);
            background-image: radial-gradient(circle at 15% 10%, rgba(91,122,133,0.08), transparent 45%), radial-gradient(circle at 85% 90%, rgba(126,152,115,0.08), transparent 45%);
            display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px;
        }
        .login-container { width:100%; max-width:440px; }
        .login-mark { display:flex; justify-content:center; margin-bottom:14px; color:var(--accent); }
        .login-card { background:var(--white); border-radius:20px; padding:36px 32px; box-shadow: var(--shadow-lg); border-top:3px solid var(--accent); }
        .login-title { font-size:1.7rem; font-weight:600; text-align:center; margin-bottom:6px; }
        .login-subtitle { text-align:center; color:var(--gray-500); margin-bottom:22px; font-size:0.95rem; }
        .error-area { background:var(--red-light); border:1px solid var(--red); color:var(--red-dark); padding:11px 15px; border-radius:var(--radius-sm); margin-bottom:16px; font-weight:600; font-size:0.90rem; }
        .login-hint { margin-top:18px; text-align:center; background:var(--gray-50); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--gray-100); font-size:0.88rem; }
        .login-note { text-align:center; margin-top:12px; font-size:0.82rem; color:var(--gray-500); }
    </style>
</body>
</html>
